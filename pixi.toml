[workspace]
authors = [
  "Juan-Pablo Catalan <jpcatalan@ind.uned.es>",
  "Patrick Sauvan <psauvan@ind.uned.es>"
]
channels = ["conda-forge"]
name = "geouned"
platforms = ["linux-64"]  # TODO @dvp2015: add other platforms with testing
version = "0.1.0"
conda-pypi-map = false

[tasks]

[dependencies]
python = ">=3.12,<3.14"  # TODO @dvp2015: 3.14+ requires more testing 
tqdm = ">=4.69.0,<5"
numpy = ">=2.5.1,<3"
freecad = ">=1.1.0,<2"
openmc = ">=0.15.3,<0.16"

[pypi-dependencies]
geouned = { path = ".", editable = true }

[feature.test.dependencies]
pytest = ">=9.0"
pytest-xdist = ">=3.8.0,<4"
pytest-cov = ">=7.1.0,<8"

[feature.test.tasks]
test = "pytest"

[environments]
test = { features = [ "test" ], solve-group="default" }
